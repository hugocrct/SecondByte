<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <title>Gestió SecondByte - Automàtic</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css" />
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body>
  <div class="container p-5">
    <div id="alert" class="alert" style="display:none;" role="alert"></div>

    <div id="loginForm">...</div> 

    <div class="col-12" id="appContent" style="display: none">
      <div class="row">
        
        <div class="col-md-6">
          <div class="card p-3 mb-3 bg-light shadow-sm">
            <h4>📦 Nou Component</h4>
            <form id="formNewComponent">
              <input type="text" class="form-control mb-2" id="compNom" placeholder="Nom del component" required />
              <select class="form-control mb-2" id="compCategoria">
                <option value="CPU">CPU</option>
                <option value="GPU">GPU</option>
                <option value="RAM">RAM</option>
                <option value="Placa Base">Placa Base</option>
                <option value="PSU">PSU</option>
              </select>
              <input type="number" class="form-control mb-2" id="compPreu" placeholder="Preu (€)" />
              <input type="file" class="form-control-file mb-2" id="compImages" multiple accept="image/*" />
              <button type="button" id="btnSaveComponent" class="btn btn-success btn-block">Publicar Component</button>
            </form>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3 mb-3 border-primary shadow-sm">
            <h4>📖 Nova Guia de Muntatge</h4>
            <form id="formNewGuia">
              <input type="text" class="form-control mb-2" id="guiaNom" placeholder="Títol de la guia" required />
              
              <label><small>1. Selecciona la Categoria:</small></label>
              <select class="form-control mb-2" id="guiaFiltreCategoria" onchange="updateComponentDropdown(this.value)">
                <option value="">-- Tria una categoria --</option>
                <option value="CPU">CPU</option>
                <option value="GPU">GPU</option>
                <option value="RAM">RAM</option>
                <option value="Placa Base">Placa Base</option>
                <option value="PSU">PSU</option>
              </select>

              <label><small>2. Selecciona el Producte:</small></label>
              <select class="form-control mb-2" id="guiaIdComp" disabled>
                <option value="">Primer tria una categoria...</option>
              </select>

              <input type="text" class="form-control mb-2" id="guiaPDF" placeholder="URL del manual PDF" required />
              <button type="button" id="btnSaveGuia" class="btn btn-primary btn-block">Publicar Guia</button>
            </form>
          </div>
        </div>
      </div>

      <div class="text-center my-4">
        <button class="btn btn-secondary mx-1" onclick="loadUsers()">Usuaris</button>
        <button class="btn btn-info mx-1" onclick="loadGuias()">Guies</button>
        <button id="logout" class="btn btn-outline-danger mx-1">Sortir</button>
      </div>

      <table class="table table-striped" id="listUsers"></table>
      <table class="table table-striped" id="listGuias"></table>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/firestore.js"></script>
  <script src="js/usuaris.js"></script>
  <script src="js/components.js"></script>
  <script src="js/guias.js"></script>

  <script>
    // --- LÒGICA DE FILTRATGE AUTOMÀTIC ---
    async function updateComponentDropdown(categoria) {
      const selectComp = document.getElementById("guiaIdComp");
      selectComp.innerHTML = '<option value="">Carregant productes...</option>';
      selectComp.disabled = true;

      if (!categoria) {
        selectComp.innerHTML = '<option value="">Primer tria una categoria...</option>';
        return;
      }

      try {
        // Busquem a la col·lecció 'components' aquells que coincideixin amb la categoria
        const snapshot = await db.collection("components")
                                 .where("categoria", "==", categoria)
                                 .get();
        
        if (snapshot.empty) {
          selectComp.innerHTML = '<option value="">No hi ha productes en aquesta categoria</option>';
          return;
        }

        selectComp.innerHTML = '<option value="">-- Selecciona el producte --</option>';
        snapshot.forEach(doc => {
          const data = doc.data();
          // El 'value' serà l'ID (Foreign Key) i el text serà el Nom del producte
          selectComp.innerHTML += `<option value="${doc.id}">${data.nom}</option>`;
        });
        selectComp.disabled = false;

      } catch (e) {
        console.error("Error filtrant components:", e);
        showAlert("Error al carregar productes", "alert-danger");
      }
    }

    // --- RESTA DE LOGICA (Login, Salvar...) ---
    
    // Auth Listener
    auth.onAuthStateChanged(user => {
      if (user) document.getElementById("appContent").style.display = "block";
      else document.getElementById("appContent").style.display = "none";
    });

    // Guardar Guia
    document.getElementById("btnSaveGuia").onclick = async () => {
      const formData = {
        nom: document.getElementById("guiaNom").value,
        id_Component: document.getElementById("guiaIdComp").value, // Agafa l'ID del desplegable
        ubicacio_PDF: document.getElementById("guiaPDF").value
      };

      if (!formData.id_Component) return showAlert("Has de seleccionar un producte", "alert-warning");

      try {
        await addGuia(formData);
        document.getElementById("formNewGuia").reset();
        document.getElementById("guiaIdComp").disabled = true;
      } catch (e) { showAlert(e.message, "alert-danger"); }
    };

    // Funcions auxiliars (showAlert, logout...)
    function showAlert(t, c) { /* ... mateixa que abans ... */ }
    document.getElementById("logout").onclick = () => auth.signOut().then(() => location.reload());
  </script>
</body>
</html>
